name: Weekday rule harvest

on:
  schedule:
    - cron: "0 13 * * 1-5"    # Mon–Fri 13:00 UTC (~9am US Eastern) — adjust to taste
  workflow_dispatch: {}        # lets you run it manually from the Actions tab

permissions:
  contents: write
  pull-requests: write
   id-token: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "rule-harvest[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch ADO candidates
        env:
          ADO_PAT: ${{ secrets.ADO_PAT }}
        run: python scripts/harvest_fetch.py

      - name: Analyze candidates and open PR (Claude)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Read .github/harvest-prompt.md and follow it exactly."
          claude_args: "--allowedTools Bash,Read,Write,Edit,Glob,Grep"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
