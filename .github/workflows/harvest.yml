name: Weekday rule harvest

on:
  schedule:
    - cron: "0 13 * * 1-5"    # Mon–Fri 13:00 UTC (~9am US Eastern) — adjust to taste
  workflow_dispatch: {}        # lets you run it manually from the Actions tab

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "rule-harvest[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Skip if a harvest PR is already open
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n=$(gh pr list --state open --base develop --json headRefName \
               --jq '[.[] | select(.headRefName | startswith("rules/harvest-"))] | length')
          echo "open=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" -gt 0 ]; then echo "::notice::A harvest PR is already open — skipping this run."; fi

      - name: Set up Python
        if: steps.guard.outputs.open == '0'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch ADO candidates
        if: steps.guard.outputs.open == '0'
        env:
          ADO_PAT: ${{ secrets.ADO_PAT }}
        run: python scripts/harvest_fetch.py

      - name: Analyze candidates — Claude edits the rule files
        if: steps.guard.outputs.open == '0'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Read .github/harvest-prompt.md and follow it exactly."
          claude_args: "--allowedTools Read,Write,Edit,Glob,Grep"

      - name: Open pull request for new rules
        if: steps.guard.outputs.open == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/harvest_finalize.py
